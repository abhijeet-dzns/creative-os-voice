<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative OS Voice</title>
  <style>
    :root {
      --bg: #07090d;
      --card: #10141b;
      --line: #202733;
      --text: #f4f7fb;
      --muted: #8f99a8;
      --accent: #8b5cf6;
      --accent2: #6d4aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(109,74,255,.16), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(430px, 100%);
      text-align: center;
    }

    .brand {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -.03em;
    }

    .sub {
      margin: 0 auto 34px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      max-width: 320px;
    }

    .mic-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(139,92,246,.35);
      border-radius: 50%;
      transition: .25s ease;
    }

    .ring.r2 {
      inset: 12px;
      border-color: rgba(139,92,246,.22);
    }

    .mic {
      position: relative;
      z-index: 2;
      width: 112px;
      height: 112px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      box-shadow: 0 18px 50px rgba(109,74,255,.28);
      font-size: 42px;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .mic:hover { transform: scale(1.03); }
    .mic:active { transform: scale(.97); }

    .mic.listening {
      animation: pulse 1.15s infinite;
      box-shadow: 0 0 0 14px rgba(139,92,246,.08), 0 18px 60px rgba(109,74,255,.45);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .status {
      min-height: 24px;
      margin-bottom: 16px;
      color: #c6ced9;
      font-size: 14px;
    }

    .transcript {
      min-height: 92px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(16,20,27,.9);
      text-align: left;
      color: #e9edf3;
      line-height: 1.5;
      font-size: 15px;
      word-break: break-word;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .note {
      margin-top: 18px;
      color: #697383;
      font-size: 11px;
      line-height: 1.5;
    }

    .error {
      color: #ff8f8f;
    }

    .success {
      color: #a8f0c6;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      color: #7e8999;
      font-size: 11px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6b7280;
    }

    .dot.online {
      background: #58d68d;
      box-shadow: 0 0 10px rgba(88,214,141,.45);
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">Creative OS</div>
    <h1>Voice Command</h1>
    <p class="sub">Tap the microphone and speak a command.</p>

    <div class="mic-wrap">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <button class="mic" id="micButton" aria-label="Start voice command">🎙️</button>
    </div>

    <div class="status" id="status">Ready</div>

    <div class="transcript">
      <span class="label">Heard</span>
      <div id="transcript">Nothing yet.</div>
    </div>

    <div class="connection" id="connection">
      <span class="dot" id="connectionDot"></span>
      <span id="connectionText">Connecting to Creative OS...</span>
    </div>

    <div class="note">
      Voice commands are sent securely to your Creative OS Apps Script backend.
    </div>
  </main>

  <script>
    const CREATIVE_OS_URL = "https://script.google.com/macros/s/AKfycbzVjQdj9vObfe4Hey6LQfaz_XIPYgMWryUyjkU2UTnWBGa_vafShRSHljzyYeFBogdTHw/exec";

    const micButton = document.getElementById("micButton");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const connectionDot = document.getElementById("connectionDot");
    const connectionText = document.getElementById("connectionText");

    let callbackCounter = 0;

    function setConnection(online) {
      connectionDot.classList.toggle("online", online);
      connectionText.textContent = online
        ? "Creative OS connected"
        : "Creative OS connection unavailable";
    }

    function callCreativeOS(command) {
      return new Promise((resolve, reject) => {
        const callbackName = "voiceCallback_" + Date.now() + "_" + (++callbackCounter);
        const script = document.createElement("script");
        let finished = false;

        window[callbackName] = (result) => {
          if (finished) return;
          finished = true;
          cleanup();
          resolve(result);
        };

        function cleanup() {
          try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
          script.remove();
        }

        script.onerror = () => {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error("Could not reach Creative OS."));
        };

        const url =
          CREATIVE_OS_URL +
          "?voice=1" +
          "&callback=" + encodeURIComponent(callbackName) +
          "&command=" + encodeURIComponent(command);

        script.src = url;
        document.body.appendChild(script);
      });
    }

    async function testConnection() {
      try {
        await callCreativeOS("connection test");
        setConnection(true);
      } catch (e) {
        setConnection(false);
      }
    }

    async function sendVoiceCommand(command) {
      if (!command) return;

      statusEl.classList.remove("error", "success");
      statusEl.textContent = "Processing...";

      try {
        const result = await callCreativeOS(command);
        setConnection(true);

        if (result && result.success) {
          statusEl.textContent = result.message || "Done.";
          statusEl.classList.add("success");

          if ("speechSynthesis" in window && result.message) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(result.message);
            utterance.lang = "en-IN";
            utterance.rate = 1;
            window.speechSynthesis.speak(utterance);
          }
        } else {
          statusEl.textContent = result && result.message
            ? result.message
            : "I couldn't process that command.";
          statusEl.classList.add("error");
        }
      } catch (e) {
        setConnection(false);
        statusEl.textContent = "Could not connect to Creative OS.";
        statusEl.classList.add("error");
      }
    }

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusEl.textContent = "Speech recognition is not supported in this browser.";
      statusEl.classList.add("error");
      micButton.disabled = true;
      micButton.style.opacity = ".45";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      micButton.addEventListener("click", () => {
        statusEl.classList.remove("error", "success");
        transcriptEl.textContent = "Listening...";
        statusEl.textContent = "Listening...";
        micButton.classList.add("listening");

        try {
          recognition.start();
        } catch (e) {}
      });

      recognition.onresult = (event) => {
        let text = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          text += event.results[i][0].transcript;
        }

        const heard = text.trim();
        transcriptEl.textContent = heard || "Listening...";

        if (event.results[event.results.length - 1].isFinal && heard) {
          sendVoiceCommand(heard);
        }
      };

      recognition.onstart = () => {
        statusEl.classList.remove("error", "success");
        statusEl.textContent = "Listening...";
        micButton.classList.add("listening");
      };

      recognition.onend = () => {
        micButton.classList.remove("listening");
        if (statusEl.textContent === "Listening...") {
          statusEl.textContent = "Ready";
        }
      };

      recognition.onerror = (event) => {
        micButton.classList.remove("listening");

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          statusEl.textContent = "Microphone access was blocked.";
        } else {
          statusEl.textContent = "Voice recognition stopped.";
        }

        statusEl.classList.add("error");
      };
    }

    testConnection();
  </script>
</body>
</html>
