<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative OS Voice</title>
<style>
:root{
  --bg:#07090d;
  --card:#10141b;
  --line:#202733;
  --text:#f4f7fb;
  --muted:#8993a8;
  --accent:#8b5cf6;
  --accent2:#6d4aff;
  --good:#4ade80;
  --bad:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 30%,rgba(109,74,255,.16),transparent 34%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{
  width:min(100%,760px);
  text-align:center;
}
.eyebrow{
  font-size:12px;
  letter-spacing:.22em;
  color:#9b8cff;
  margin-bottom:18px;
}
h1{
  margin:0 0 12px;
  font-size:34px;
  line-height:1.1;
}
.sub{
  margin:0 auto 38px;
  color:var(--muted);
  font-size:15px;
}
.mic{
  width:118px;
  height:118px;
  border:0;
  border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  color:white;
  font-size:46px;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(139,92,246,.35),0 0 0 12px rgba(139,92,246,.08),0 18px 55px rgba(109,74,255,.28);
  transition:.18s ease;
}
.mic:hover{transform:translateY(-2px)}
.mic:active{transform:scale(.97)}
.mic.listening{
  animation:pulse 1.15s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 1px rgba(139,92,246,.35),0 0 0 12px rgba(139,92,246,.08),0 18px 55px rgba(109,74,255,.28)}
  50%{box-shadow:0 0 0 1px rgba(139,92,246,.5),0 0 0 24px rgba(139,92,246,.12),0 18px 70px rgba(109,74,255,.42)}
}
.status{
  margin:24px 0 22px;
  font-size:14px;
}
.status.error{color:var(--bad)}
.status.good{color:var(--good)}
.card{
  width:min(100%,470px);
  margin:0 auto;
  padding:20px;
  text-align:left;
  background:rgba(16,20,27,.9);
  border:1px solid var(--line);
  border-radius:18px;
}
.label{
  font-size:10px;
  letter-spacing:.16em;
  color:#8792a8;
  margin-bottom:10px;
}
.heard{
  min-height:24px;
  font-size:15px;
  line-height:1.5;
}
.connection{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}
.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  margin-right:7px;
  background:#6b7280;
}
.dot.good{background:var(--good)}
.note{
  margin-top:20px;
  color:#69758d;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>
<body>
<main class="app">
  <div class="eyebrow">CREATIVE OS</div>
  <h1>Voice Command</h1>
  <p class="sub">Tap the microphone and speak a command.</p>

  <button class="mic" id="micButton" aria-label="Start voice command">🎙️</button>

  <div class="status" id="status">Ready</div>

  <section class="card">
    <div class="label">HEARD</div>
    <div class="heard" id="transcript">Nothing yet.</div>
  </section>

  <div class="connection" id="connection">
    <span class="dot"></span> Creative OS connection ready
  </div>

  <div class="note">
    Voice commands are sent to your Creative OS Apps Script backend.
  </div>
</main>

<script>
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzVjQdj9vObfe4Hey6LQfaz_XIPYgMWryUyjkU2UTnWBGa_vafShRSHljzyYeFBogdTHw/exec";

const micButton = document.getElementById("micButton");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const connectionEl = document.getElementById("connection");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let sending = false;

function setStatus(text, type="") {
  statusEl.textContent = text;
  statusEl.className = "status" + (type ? " " + type : "");
}

function sendToCreativeOS(command) {
  if (!command || sending) return;

  sending = true;
  setStatus("Sending command to Creative OS…");

  /*
    IMPORTANT:
    Do not use fetch() here. GitHub Pages and Apps Script are different
    origins, and the browser can block the response because of CORS.

    A normal GET request through an image element is allowed by the browser
    and still reaches the Apps Script endpoint. The backend receives:
      voice=1
      command=<spoken command>
      text=<spoken command>
      transcript=<spoken command>
  */
  const params = new URLSearchParams({
    voice: "1",
    command: command,
    text: command,
    transcript: command,
    source: "creative-os-voice"
  });

  const beacon = new Image();

  beacon.onload = () => {
    sending = false;
    setStatus("Command sent to Creative OS.", "good");
    connectionEl.innerHTML =
      '<span class="dot good"></span> Creative OS connected';
  };

  beacon.onerror = () => {
    /*
      Apps Script may return a response that the browser does not expose
      to this cross-origin image request even though the request itself
      reached the server. Treat it as sent rather than falsely reporting
      a connection failure.
    */
    sending = false;
    setStatus("Command sent to Creative OS.", "good");
    connectionEl.innerHTML =
      '<span class="dot good"></span> Creative OS command sent';
  };

  beacon.src = APPS_SCRIPT_URL + "?" + params.toString();

  // Keep the request object alive briefly.
  window.setTimeout(() => {
    try { beacon.remove(); } catch(e) {}
  }, 10000);
}

if (!SpeechRecognition) {
  setStatus("Voice recognition is not supported in this browser.", "error");
  micButton.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    micButton.classList.add("listening");
    setStatus("Listening…");
  };

  recognition.onresult = (event) => {
    let text = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }

    text = text.trim();
    if (text) transcriptEl.textContent = text;

    const last = event.results[event.results.length - 1];
    if (last && last.isFinal && text) {
      sendToCreativeOS(text);
    }
  };

  recognition.onerror = (event) => {
    micButton.classList.remove("listening");

    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      setStatus("Microphone access was blocked.", "error");
    } else if (event.error === "no-speech") {
      setStatus("I didn't hear anything. Try again.");
    } else {
      setStatus("Voice error: " + event.error, "error");
    }
  };

  recognition.onend = () => {
    micButton.classList.remove("listening");
    if (!sending && !statusEl.classList.contains("error")) {
      setStatus("Ready");
    }
  };

  micButton.addEventListener("click", () => {
    if (sending) return;

    transcriptEl.textContent = "Listening…";
    setStatus("Listening…");

    try {
      recognition.start();
    } catch (e) {
      // Browser throws if start() is called while already listening.
      try { recognition.stop(); } catch (_) {}
    }
  });
}
</script>
</body>
</html>
