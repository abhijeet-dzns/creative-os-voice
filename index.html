<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative OS Voice</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#090a0d;
  color:#f5f6f8;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(430px,100%);
  padding:24px;
}

.brand{
  font-size:28px;
  font-weight:700;
  letter-spacing:-.8px;
}

.sub{
  margin-top:6px;
  color:#8b919d;
  font-size:12px;
}

.card{
  margin-top:22px;
  background:#121419;
  border:1px solid #292d36;
  border-radius:20px;
  padding:22px;
}

.voice{
  width:92px;
  height:92px;
  border-radius:50%;
  border:1px solid #292d36;
  background:#191c22;
  color:#f5f6f8;
  font-size:34px;
  display:block;
  margin:18px auto;
  cursor:pointer;
  transition:.2s;
}

.voice:hover{
  transform:scale(1.04);
}

.voice.listening{
  background:#f4f5f7;
  color:#090a0d;
}

.status{
  text-align:center;
  color:#8b919d;
  font-size:12px;
  min-height:18px;
}

.transcript{
  margin-top:18px;
  padding:14px;
  background:#191c22;
  border:1px solid #292d36;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
  min-height:48px;
  word-break:break-word;
}

.result{
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  background:#191c22;
  border:1px solid #292d36;
  font-size:12px;
  line-height:1.5;
  display:none;
}

.result.show{
  display:block;
}

.result.success{
  color:#74d69b;
}

.result.error{
  color:#ff7777;
}

.examples{
  margin-top:18px;
  color:#8b919d;
  font-size:11px;
  line-height:1.7;
}

.examples b{
  color:#f5f6f8;
}

.footer{
  text-align:center;
  color:#555b66;
  font-size:10px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">Creative OS</div>
  <div class="sub">Voice remote</div>

  <div class="card">

    <button
      id="voiceBtn"
      class="voice"
      onclick="toggleVoice()"
      aria-label="Voice command">
      🎙️
    </button>

    <div id="status" class="status">
      Tap the mic and speak
    </div>

    <div id="transcript" class="transcript">
      Your command will appear here.
    </div>

    <div id="result" class="result"></div>

    <div class="examples">
      <b>Try:</b><br>
      Add a task called poster design<br>
      Add a job task called Gbazar packaging, urgent, deadline 12 September<br>
      Remind me tomorrow at 10 AM to export the video<br>
      Complete task 001
    </div>

  </div>

  <div class="footer">
    Creative OS • Google Apps Script voice bridge
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzVJQdj9vObfe4Hey6LQfaz_XIPYgMWryUyjkU2UTnWBGa_vafShRSHljzyYeFBogdTHw/exec";

let recognition = null;
let listening = false;
let finalText = "";

const $ = id => document.getElementById(id);

function setStatus(text){
  $("status").textContent = text;
}

function showResult(message, success){
  const box = $("result");

  box.textContent = message || "Command completed.";

  box.className =
    "result show " +
    (success ? "success" : "error");
}

function speak(text){
  if(!("speechSynthesis" in window)) return;

  try{
    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";
    utterance.rate = 1;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
  }catch(e){}
}

function setupVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    setStatus(
      "Voice input is not supported in this browser"
    );

    $("voiceBtn").disabled = true;
    $("voiceBtn").style.opacity = ".4";

    return;
  }

  recognition = new SR();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = function(){

    listening = true;
    finalText = "";

    $("voiceBtn").classList.add("listening");
    $("voiceBtn").textContent = "⏹";

    setStatus("Listening...");

    $("transcript").textContent = "";
    $("result").className = "result";
  };

  recognition.onresult = function(event){

    let text = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){
      text += event.results[i][0].transcript;
    }

    text = text.trim();

    $("transcript").textContent =
      text || "Listening...";

    const last =
      event.results[event.results.length - 1];

    if(last && last.isFinal){

      finalText = text;

      if(finalText){
        sendVoiceCommand(finalText);
      }
    }
  };

  recognition.onerror = function(event){

    listening = false;

    $("voiceBtn").classList.remove("listening");
    $("voiceBtn").textContent = "🎙️";

    const messages = {
      "not-allowed":
        "Microphone permission was blocked.",
      "service-not-allowed":
        "Speech service is unavailable.",
      "no-speech":
        "No speech detected.",
      "audio-capture":
        "No microphone was detected."
    };

    setStatus(
      messages[event.error] ||
      "Voice input error."
    );
  };

  recognition.onend = function(){

    listening = false;

    $("voiceBtn").classList.remove("listening");
    $("voiceBtn").textContent = "🎙️";

    if(!finalText){
      setStatus("Tap the mic and speak");
    }
  };
}

function toggleVoice(){

  if(!recognition){
    setupVoice();
  }

  if(!recognition) return;

  if(listening){
    recognition.stop();
    return;
  }

  finalText = "";

  try{
    recognition.start();
  }catch(e){
    setStatus("Tap the mic again");
  }
}

function sendVoiceCommand(command){

  setStatus("Sending command...");

  const callbackName =
    "creativeOSVoice_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*10000);

  let finished = false;

  const script =
    document.createElement("script");

  function cleanup(){

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

    try{
      delete window[callbackName];
    }catch(e){
      window[callbackName] = undefined;
    }
  }

  window[callbackName] = function(data){

    if(finished) return;

    finished = true;

    cleanup();

    if(data && data.success){

      const message =
        data.message ||
        "Command completed.";

      setStatus("Done");

      showResult(message, true);

      speak(message);

    }else{

      const message =
        data && data.message
          ? data.message
          : "The command could not be completed.";

      setStatus("Command failed");

      showResult(message, false);

      speak(message);
    }
  };

  script.onerror = function(){

    if(finished) return;

    finished = true;

    cleanup();

    setStatus("Connection failed");

    showResult(
      "Creative OS could not be reached.",
      false
    );
  };

  const url =
    API_URL +
    "?voice=1" +
    "&command=" +
    encodeURIComponent(command) +
    "&callback=" +
    encodeURIComponent(callbackName);

  script.src = url;

  document.body.appendChild(script);

  setTimeout(function(){

    if(finished) return;

    finished = true;

    cleanup();

    setStatus("No response");

    showResult(
      "Creative OS did not respond in time.",
      false
    );

  }, 25000);
}

setupVoice();

</script>

</body>
</html>
