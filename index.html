<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Creative OS • Voice Remote</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #080b0f;
  color: #f4f5f7;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 42px 20px 60px;
}

.header {
  margin-bottom: 34px;
}

.title {
  font-size: 38px;
  line-height: 1;
  font-weight: 750;
  letter-spacing: -1.5px;
  margin-bottom: 12px;
}

.subtitle {
  color: #858b96;
  font-size: 16px;
}

.card {
  background: #111419;
  border: 1px solid #292e36;
  border-radius: 28px;
  padding: 38px 28px 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.voice-area {
  text-align: center;
}

.mic {
  width: 154px;
  height: 154px;
  border-radius: 50%;
  border: 1px solid #343b46;
  background: #171c24;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 22px;
  cursor: pointer;
  transition: .2s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.mic:active {
  transform: scale(.96);
}

.mic.listening {
  transform: scale(1.04);
  border-color: #777f8d;
  box-shadow:
    0 0 0 8px rgba(255,255,255,.035),
    0 0 45px rgba(255,255,255,.08);
}

.mic-icon {
  font-size: 64px;
  line-height: 1;
}

.status {
  color: #8e949e;
  font-size: 17px;
  min-height: 25px;
}

.transcript,
.result {
  margin-top: 24px;
  padding: 18px 20px;
  border-radius: 18px;
  background: #181d25;
  border: 1px solid #2a3039;
  text-align: left;
  font-size: 16px;
  line-height: 1.5;
  word-break: break-word;
}

.transcript {
  color: #e6e8ec;
}

.result {
  color: #b8bec8;
}

.result.success {
  color: #dfe3e8;
}

.result.error {
  color: #ff7777;
}

.label {
  display: block;
  color: #747b86;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
}

.connection {
  margin-top: 24px;
  width: 100%;
  border: 1px solid #303640;
  background: #171c23;
  color: #e5e8ec;
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
}

.connection:active {
  transform: scale(.99);
}

.examples {
  margin-top: 28px;
}

.examples-title {
  color: #8b919b;
  font-size: 13px;
  margin-bottom: 12px;
}

.example {
  color: #8f96a1;
  font-size: 14px;
  line-height: 1.45;
  margin: 7px 0;
}

.footer {
  text-align: center;
  color: #4f555e;
  font-size: 12px;
  margin-top: 30px;
}

@media (max-width: 480px) {
  .app {
    padding: 34px 16px 45px;
  }

  .title {
    font-size: 34px;
  }

  .card {
    padding: 32px 20px 25px;
    border-radius: 24px;
  }

  .mic {
    width: 145px;
    height: 145px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">Creative OS</div>
    <div class="subtitle">Voice remote</div>
  </div>

  <div class="card">

    <div class="voice-area">

      <div
        id="mic"
        class="mic"
        onclick="startListening()"
        aria-label="Voice command"
      >
        <div class="mic-icon">🎙️</div>
      </div>

      <div id="status" class="status">
        Tap microphone to speak
      </div>

    </div>

    <div id="transcript" class="transcript" style="display:none;"></div>

    <div id="result" class="result" style="display:none;"></div>

    <button
      class="connection"
      onclick="connectionTest()"
    >
      Test Creative OS connection
    </button>

    <div class="examples">

      <div class="examples-title">Try:</div>

      <div class="example">
        Add a task called poster design
      </div>

      <div class="example">
        Add a job task called Gbazar packaging,
        urgent, deadline 12 September
      </div>

      <div class="example">
        Remind me tomorrow at 10 AM to export the video
      </div>

      <div class="example">
        Complete task 001
      </div>

    </div>

  </div>

  <div class="footer">
    Creative OS • Google Apps Script voice bridge
  </div>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzVJQdj9vObfe4Hey6LQfaz_XIPYgMWryUyjkU2UTnWBGa_vafShRSHljzyYeFBogdTHw/exec";

let recognition = null;
let listening = false;
let requestTimeout = null;


/* -----------------------------------------
   SPEECH RECOGNITION
----------------------------------------- */

function setupSpeechRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus(
      "Voice recognition is not supported in this browser."
    );
    return false;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {

    listening = true;

    document
      .getElementById("mic")
      .classList.add("listening");

    setStatus("Listening...");
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();

    showTranscript(text);

    setStatus("Sending command...");

    sendVoiceCommand(text);
  };

  recognition.onerror = function(event) {

    listening = false;

    document
      .getElementById("mic")
      .classList.remove("listening");

    if (event.error === "not-allowed") {

      setStatus(
        "Microphone permission was blocked."
      );

    } else {

      setStatus(
        "Voice error: " + event.error
      );
    }
  };

  recognition.onend = function() {

    listening = false;

    document
      .getElementById("mic")
      .classList.remove("listening");
  };

  return true;
}


function startListening() {

  if (!recognition) {

    if (!setupSpeechRecognition()) {
      return;
    }
  }

  if (listening) {

    recognition.stop();

    return;
  }

  hideResult();

  try {

    recognition.start();

  } catch (error) {

    console.error(error);

    setStatus(
      "Could not start microphone."
    );
  }
}


/* -----------------------------------------
   UI
----------------------------------------- */

function setStatus(text) {

  document.getElementById("status").textContent =
    text;
}


function showTranscript(text) {

  const box =
    document.getElementById("transcript");

  box.style.display = "block";

  box.innerHTML =
    '<span class="label">You said</span>' +
    escapeHtml(text);
}


function showResult(message, success) {

  const box =
    document.getElementById("result");

  box.style.display = "block";

  box.className =
    "result " +
    (success ? "success" : "error");

  box.innerHTML =
    '<span class="label">Creative OS</span>' +
    escapeHtml(message);
}


function hideResult() {

  const box =
    document.getElementById("result");

  box.style.display = "none";
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* -----------------------------------------
   GOOGLE APPS SCRIPT JSONP
----------------------------------------- */

function sendVoiceCommand(command) {

  const callbackName =
    "creativeOSCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  const params = new URLSearchParams();

  params.set("voice", "1");
  params.set("command", command);
  params.set("callback", callbackName);

  const url =
    APPS_SCRIPT_URL +
    "?" +
    params.toString();

  let finished = false;

  function cleanup() {

    if (finished) return;

    finished = true;

    if (requestTimeout) {
      clearTimeout(requestTimeout);
      requestTimeout = null;
    }

    window[callbackName] = null;

    try {
      delete window[callbackName];
    } catch (e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }


  window[callbackName] = function(data) {

    cleanup();

    if (!data) {

      setStatus("No response received.");

      showResult(
        "Creative OS returned no response.",
        false
      );

      return;
    }

    if (data.success) {

      setStatus("Command completed.");

      showResult(
        data.message ||
        "Command completed successfully.",
        true
      );

      speak(
        data.message ||
        "Done."
      );

    } else {

      setStatus("Command failed.");

      showResult(
        data.message ||
        "Creative OS could not complete the command.",
        false
      );

      speak(
        data.message ||
        "The command failed."
      );
    }
  };


  script.onerror = function() {

    cleanup();

    setStatus("Connection failed.");

    showResult(
      "Creative OS could not be reached. Check the Apps Script deployment.",
      false
    );
  };


  script.src = url;

  document.body.appendChild(script);


  requestTimeout = setTimeout(function() {

    cleanup();

    setStatus("Connection timed out.");

    showResult(
      "Creative OS did not respond. Make sure the Apps Script web app is deployed as 'Anyone'.",
      false
    );

  }, 20000);
}


/* -----------------------------------------
   CONNECTION TEST
----------------------------------------- */

function connectionTest() {

  hideResult();

  showTranscript("connection test");

  setStatus("Testing connection...");

  sendVoiceCommand("connection test");
}


/* -----------------------------------------
   TEXT TO SPEECH
----------------------------------------- */

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  try {

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";
    utterance.rate = 1;
    utterance.pitch = 1;

    window.speechSynthesis.speak(
      utterance
    );

  } catch (error) {

    console.error(error);
  }
}


/* -----------------------------------------
   INITIALIZE
----------------------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setupSpeechRecognition();

  }
);

</script>

</body>
</html>
